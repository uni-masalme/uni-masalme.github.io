<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unterrichtsmaterialien</title>
<style>
:root{--bg:#fbfaf8;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#57534e;--card:#292524}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;padding:48px 16px}
main{max-width:34em;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 .25em}
p.sub{color:var(--muted);margin:0 0 2rem}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
a.card:hover{border-color:var(--muted)}
a.card b{display:block;font-size:1.05rem}
a.card span{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Unterrichtsmaterialien</h1>
  <p class="sub">Deutsch — Sekundarstufe I</p>
  <a class="card" href="deutsch/">
    <b>Die Schablone einer begründeten Stellungnahme</b>
    <span>Mustertext zu Marlene Röder, „Chuck Norris und seine Freunde“, Schritt für Schritt aufgeschlüsselt</span>
  </a>
</main>
</body>
</html>
